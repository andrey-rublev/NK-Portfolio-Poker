name: Build & Deploy

# Rebuilds and redeploys:
#  - on every push to main
#  - on demand from the Actions tab
# Content is maintained by hand in src/data/portfolio.json (no automatic
# Devpost/LinkedIn scraping).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let a newer run cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Build. VITE_BASE makes assets resolve under a project-pages sub-path
      # (https://<user>.github.io/<repo>/). For a user page or custom domain,
      # set the repository variable VITE_BASE to "/" instead.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - id: deploy
        uses: actions/deploy-pages@v4
