<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Launched from the Home Screen these drop Safari's chrome entirely,
         which is the only way to reclaim the toolbar's space on iPhone. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nikhil Kolli" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="A single-screen poker-table portfolio for Nikhil Kolli, with a blank felt opening and an animated deal revealing each section as a selectable card."
    />
    <meta name="theme-color" content="#07130f" />
    <title>Nikhil Kolli | Poker Table Portfolio</title>
    <link rel="canonical" href="https://nikhilkolli.com/" />
    <!-- Link previews (LinkedIn, iMessage, Slack, X). The image URL must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nikhilkolli.com/" />
    <meta property="og:site_name" content="Nikhil Kolli" />
    <meta property="og:title" content="Nikhil Kolli | Poker Table Portfolio" />
    <meta property="og:description" content="An interactive portfolio rendered as a 3D poker table." />
    <meta property="og:image" content="https://nikhilkolli.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A 3D poker table where each player's seat is a section of Nikhil Kolli's portfolio." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
