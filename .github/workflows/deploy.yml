name: Build & Deploy (auto-updating)

# Rebuilds and redeploys:
#  - on every push to main
#  - once a day (07:00 UTC) so new Devpost/LinkedIn entries are pulled in
#  - on demand from the Actions tab
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let a newer run cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Pull the latest Devpost (and optional LinkedIn) data. Never fails the build.
      - name: Refresh portfolio data
        run: npm run fetch:data
        env:
          # Optional: override the Devpost handle without editing portfolio.json.
          DEVPOST_USER: ${{ vars.DEVPOST_USER }}

      # Build. VITE_BASE makes assets resolve under a project-pages sub-path
      # (https://<user>.github.io/<repo>/). For a user page or custom domain,
      # set the repository variable VITE_BASE to "/" instead.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - id: deploy
        uses: actions/deploy-pages@v4
